name: ${COMPOSE_PROJECT_NAME:-cnr-dev}

services:
  mariadb:
    image: mariadb:11.4.10
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      CNR_DB_NAME: ${CNR_DB_NAME}
      CNR_DB_TEST_NAME: ${CNR_DB_TEST_NAME}
      CNR_DB_RUNTIME_USER: ${CNR_DB_RUNTIME_USER}
      CNR_DB_RUNTIME_PASSWORD: ${CNR_DB_RUNTIME_PASSWORD}
      CNR_DB_MIGRATION_USER: ${CNR_DB_MIGRATION_USER}
      CNR_DB_MIGRATION_PASSWORD: ${CNR_DB_MIGRATION_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    ports:
      - '${CNR_DB_PORT:-3307}:3306'
    volumes:
      - cnr_mariadb_data:/var/lib/mysql
      - ./database/docker/10-create-development-databases.sh:/docker-entrypoint-initdb.d/10-create-development-databases.sh:ro
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  cnr_mariadb_data:
