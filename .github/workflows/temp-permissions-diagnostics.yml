name: Temporary permissions diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose-database:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: mysql://cnr_migration:ci-migration-password@127.0.0.1:3306/cnr_permissions_diagnostics
    steps:
      - name: Check out pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies quietly
        run: |
          ./tools/materialize-lockfile.sh
          corepack enable
          corepack prepare pnpm@11.13.1 --activate >/dev/null
          pnpm install --frozen-lockfile --silent

      - name: Start MariaDB quietly
        run: |
          docker pull --quiet mariadb:11.4.10
          docker run --detach --name cnr-permissions-db \
            --publish 3306:3306 \
            --env MARIADB_ROOT_PASSWORD=ci-root-password \
            --env MARIADB_DATABASE=cnr_permissions_diagnostics \
            --env MARIADB_USER=cnr_migration \
            --env MARIADB_PASSWORD=ci-migration-password \
            mariadb:11.4.10 >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec cnr-permissions-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs cnr-permissions-db
          exit 1

      - name: Rehearse migration rollback and reapply
        run: |
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql --wait --no-dump-schema up
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql status
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql --no-dump-schema rollback
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql --no-dump-schema up
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql status
