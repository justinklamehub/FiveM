name: Temporary permissions diagnostics

on:
  push:
    branches:
      - agent/wave-1-player-lifecycle

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4.10
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: cnr_permissions_diagnostics
          MARIADB_USER: cnr_migration
          MARIADB_PASSWORD: ci-migration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://cnr_migration:ci-migration-password@127.0.0.1:3306/cnr_permissions_diagnostics
    steps:
      - name: Check out Wave 1 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/wave-1-player-lifecycle
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0

      - name: Install pinned dependencies
        run: |
          ./tools/materialize-lockfile.sh
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile

      - name: Format owned Lua sources
        run: pnpm exec stylua 'resources/[cnr]' tests/lua

      - name: Run migration diagnostics
        id: migration
        continue-on-error: true
        run: |
          mkdir -p diagnostics
          set -o pipefail
          pnpm exec dbmate --migrations-dir database/migrations --schema-file database/schema.sql --wait --no-dump-schema up 2>&1 | tee diagnostics/permissions-db.log

      - name: Remove successful diagnostic output
        if: steps.migration.outcome == 'success'
        run: rm -f diagnostics/permissions-db.log

      - name: Commit formatter and diagnostics
        run: |
          if git diff --quiet -- 'resources/[cnr]' tests/lua diagnostics; then
            echo 'No diagnostic changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'resources/[cnr]' tests/lua diagnostics
          git commit -m 'Format and diagnose technical permissions'
          git push origin HEAD:agent/wave-1-player-lifecycle

      - name: Fail when migration failed
        if: steps.migration.outcome != 'success'
        run: exit 1
