name: Verify dynamic shops payload fragments

on:
  pull_request:
    branches:
      - agent/wave-1-player-lifecycle
    types:
      - synchronize

permissions:
  issues: read

jobs:
  verify:
    if: >-
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.ref == 'agent/wave-2-economic-foundations'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Report fragment lengths and hashes
        shell: bash
        run: |
          set -euo pipefail
          comment_ids=(5024201513 5024231379 5024389278 5024408513 5024289059)
          for comment_id in "${comment_ids[@]}"; do
            file="/tmp/${comment_id}.txt"
            gh api "repos/${{ github.repository }}/issues/comments/${comment_id}" --jq .body \
              | tail -n +2 | tr -d '\n\r' > "${file}"
            printf '%s %s %s\n' \
              "${comment_id}" \
              "$(wc -c < "${file}" | tr -d ' ')" \
              "$(sha256sum "${file}" | awk '{print $1}')"
          done
