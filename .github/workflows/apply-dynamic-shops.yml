name: Export dynamic shops payload fragments

on:
  pull_request:
    branches:
      - agent/wave-1-player-lifecycle
    types:
      - synchronize

permissions:
  issues: read

jobs:
  export:
    if: >-
      github.event.pull_request.number == 3 &&
      github.event.pull_request.head.ref == 'agent/wave-2-economic-foundations'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Export comment fragments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dynamic-shops-fragments
          comment_ids=(5024201513 5024231379 5024389278)
          names=(part-0 part-1 q0)
          for index in 0 1 2; do
            gh api "repos/${{ github.repository }}/issues/comments/${comment_ids[$index]}" --jq .body \
              | tail -n +2 | tr -d '\n\r' \
              > "/tmp/dynamic-shops-fragments/${names[$index]}"
          done
      - name: Upload verified fragments
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-shops-verified-fragments
          path: /tmp/dynamic-shops-fragments
          if-no-files-found: error
          retention-days: 1
