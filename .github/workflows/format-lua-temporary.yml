name: Temporary Lua formatter

on:
  push:
    branches:
      - agent/wave-1-player-lifecycle

permissions:
  contents: write

jobs:
  format-lua:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Wave 1 branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/wave-1-player-lifecycle
          fetch-depth: 0

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0

      - name: Install pinned formatter
        run: |
          ./tools/materialize-lockfile.sh
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm install --frozen-lockfile

      - name: Format owned Lua sources
        run: pnpm exec stylua 'resources/[cnr]' tests/lua

      - name: Commit formatted Lua sources
        run: |
          if git diff --quiet -- 'resources/[cnr]' tests/lua; then
            echo 'No Lua formatting changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'resources/[cnr]' tests/lua
          git commit -m 'Format FiveM module loader'
          git push origin HEAD:agent/wave-1-player-lifecycle
